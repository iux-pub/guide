  <canvas class="scene__canvas" aria-hidden="true"></canvas>
  <div class="scene__veil" aria-hidden="true"></div>

  </svg>
  <div class="container scene__body">
    <h1 class="scene__title" id="scene-title"><span class="scene__title-line">{{title_line_1}}</span> <span class="scene__title-line">{{title_line_2}}</span></h1>
    <p class="scene__lead">{{lead}}</p>

    <nav class="quick-row" aria-label="{{quick_label}}">
      <ul class="quick-row__list" role="list">
        <!-- @each tasks as task -->
        <li><a class="quick-row__link" href="{{task.href}}"><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#{{task.icon}}"></use></svg>{{task.label}}</a></li>
        <!-- @end -->
      </ul>
    </nav>

    <div class="float-panel">
      <h2 class="float-panel__title" id="scene-panel-title">{{panel_title}}</h2>
      <div class="carousel" role="region" aria-roledescription="carousel" aria-labelledby="scene-panel-title" data-carousel data-carousel-autoplay="7000">
        <div class="carousel__controls">
          <button type="button" class="carousel__toggle" data-carousel-toggle>
            <svg class="icon icon--small" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#pause"></use></svg>
            <span class="sr-only">자동 넘김 정지</span>
          </button>
          <button type="button" class="carousel__nav" data-carousel-prev>
            <svg class="icon icon--small" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#chevron-left"></use></svg>
            <span class="sr-only">이전 항목</span>
          </button>
          <p class="carousel__counter" aria-hidden="true"><span class="float-panel__now" data-carousel-current>1</span> / <span data-carousel-total>{{slides.@count}}</span></p>
          <button type="button" class="carousel__nav" data-carousel-next>
            <svg class="icon icon--small" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg#chevron-right"></use></svg>
            <span class="sr-only">다음 항목</span>
          </button>
        </div>
        <div class="carousel__viewport">
          <div class="carousel__track" aria-live="off">
            <!-- @each slides as slide -->
            <div class="carousel__slide" role="group" aria-roledescription="slide" aria-label="{{slide.@n}} / {{slide.@count}}">
              <img class="float-panel__img" src="{{slide.img_src}}" alt="{{slide.img_alt}}" width="960" height="540"{{slide.@first:| loading="lazy"}}>
              <h3 class="float-panel__name">{{slide.name}}</h3>
              <ul class="float-panel__work" role="list">
                <!-- @each slide.work as work -->
                <li class="float-panel__task">{{work.text}}</li>
                <!-- @end -->
              </ul>
            </div>
            <!-- @end -->
          </div>
        </div>
      </div>
      <a class="float-panel__more" href="{{more_href}}">{{more_label}}</a>
    </div>
  </div>
</section>
