name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 검증 (check + lint + build + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      # MCP 서버는 독립 패키지다(mcp/package.json). 설치하지 않으면 실제 서버를 띄우는 단위 테스트가 건너뛰어진다
      - name: MCP 서버 의존성 설치
        run: npm ci --prefix mcp

      - name: 컨트랙트 위반 검사 (rules.json 전체) — 토큰/BEM/접근성
        run: node scripts/check-violations.js

      - name: HTML 구조 검사 (R-15~R-18) — root 태그/ARIA/상태 클래스/modifier
        run: node scripts/check-html-structure.js

      - name: KRDS+INFOMIND 토큰 빌드
        run: npm run build:tokens

      - name: Stylelint
        run: npm run lint:css

      - name: ESLint (scripts · studio · mcp/bin · cli/bin)
        run: npm run lint:js

      - name: 검사기 단위 테스트
        run: npm run test:unit

      - name: 규칙 자동 생성 검증 (rules.json → CLAUDE.md/conventions/)
        run: npm run build:rules

      - name: AI 프롬프트 자동 생성 검증
        run: npm run build:prompts

      - name: 레퍼런스 자동 생성 검증 (tokens.css·스니펫 → references/)
        run: npm run build:references

      - name: MCP 번들 자동 생성 검증 (references·rules·contracts → mcp/data/)
        run: npm run build:mcp

      - name: 스타터 로컬 동기화 및 하네스 검증
        run: |
          npm run sync:starter
          npm run check:harness
          (cd starter && npm run check)

      - name: 자동 생성물 drift 검사
        run: |
          # 생성물에는 커밋 sha를 싣지 않는다(package.json version만) — 같은 원본이면 같은 결과가 나와야 한다
          if ! git diff --exit-code -- CLAUDE.md AGENTS.md site/conventions/ site/prompts/ prompts/ tokens/build/ references/ mcp/data/ mcp/bin/icon-search.js starter/; then
            echo ""
            echo "❌ 자동 생성물이 최신이 아닙니다."
            echo "   다음 명령을 실행하고 결과를 커밋하세요:"
            echo ""
            echo "   npm run build:tokens && npm run build:rules && npm run build:prompts && npm run build:references && npm run build:mcp && npm run sync:starter"
            echo ""
            exit 1
          fi
          # 새로 생긴 생성물(추적되지 않은 파일)도 drift다 — git diff는 추적 파일만 본다
          untracked="$(git ls-files --others --exclude-standard -- references/ mcp/data/ starter/ prompts/ site/conventions/)"
          if [ -n "$untracked" ]; then
            echo "❌ 커밋되지 않은 새 생성물:"
            echo "$untracked"
            exit 1
          fi

      - name: Tailwind v4 CSS 빌드
        run: |
          npm run build:css
          npm run build:docs-css

      - name: Eleventy 사이트 빌드
        run: npx @11ty/eleventy

      - name: 접근성 검증 (pa11y-ci, KWCAG/WCAG 2.1 AA)
        run: |
          npx puppeteer browsers install chrome
          npx pa11y-ci --config .pa11yci.js
