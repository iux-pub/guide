<section class="section section--intro inverse-surface cover" aria-labelledby="cover-title">
  <figure class="cover__media">
    <img class="cover__img" src="{{photo_src}}" alt="" width="1600" height="1200">
  </figure>
  <div class="container cover__body">
    <h1 class="cover__title" id="cover-title">{{title}}</h1>
    <p class="cover__lead">{{lead}}</p>
    <div class="cover__actions">
      <a class="btn btn--primary btn--large" href="{{action_href}}">{{action_label}}</a>
    </div>
  </div>
</section>
