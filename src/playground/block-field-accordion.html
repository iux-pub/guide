<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업영역 사진 아코디언 (field-accordion) - 블록 미리보기</title>
  <link rel="preload" href="../../assets/fonts/standard-gov/PretendardGOV-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/standard-gov/PretendardGOV-Bold.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../dist/css/style.css">
</head>
<body>
  <a href="#main" class="skip-to-content">본문 바로가기</a>

  <header id="header" class="site-header">
    <div class="container">
      <!-- 브랜드, GNB, 유틸리티 — 전체 마크업은 header 스니펫. 통합검색은 공공 프로필에서 필수(R-40) -->
      <form class="site-header__search" role="search" action="/search">
        <label for="site-search" class="sr-only">통합검색</label>
        <input id="site-search" class="site-header__search-input" type="search" name="q">
        <button type="submit" class="btn btn--secondary">검색</button>
      </form>
    </div>
  </header>

  <main id="main">
    <!-- 블록: field-accordion — 사업영역 사진 아코디언 -->
    <section class="section section--content field-accordion" aria-labelledby="field-accordion-title">
      <div class="container">
        <div class="field-accordion__head">
          <h2 class="field-accordion__title" id="field-accordion-title">사업영역</h2>
          <p class="field-accordion__lead">공연·전시·예술 교육·예술인 지원·시설 운영</p>
          <a class="field-accordion__more" href="/business">사업영역 자세히 보기<svg class="icon icon--small" aria-hidden="true" focusable="false"><use href="../../assets/icons/sprite.svg#arrow-right"></use></svg></a>
        </div>
        <ul class="field-accordion__list" role="list">
          <li class="field-accordion__item">
            <img class="field-accordion__img" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 1400'%3E%3Crect width='1120' height='1400' fill='%233d5f80'/%3E%3Cpath d='M0 900 Q280 820 560 880 T1120 860 V1400 H0 Z' fill='%2323394f'/%3E%3C/svg%3E" alt="객석에서 바라본 시립 극장 무대의 리허설" width="1120" height="1400" loading="lazy">
            <div class="field-accordion__text">
              <h3 class="field-accordion__name"><a class="field-accordion__link" href="/business/stage">공연·전시 기획</a></h3>
              <p class="field-accordion__desc">시립 극장 기획 공연과 항구 미술관 전시 운영</p>
            </div>
          </li>
          <li class="field-accordion__item">
            <img class="field-accordion__img" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 1400'%3E%3Crect width='1120' height='1400' fill='%23c98a3d'/%3E%3Cpath d='M0 900 Q280 820 560 880 T1120 860 V1400 H0 Z' fill='%237a5222'/%3E%3C/svg%3E" alt="미술 교실에서 그림을 그리는 어린이들" width="1120" height="1400" loading="lazy">
            <div class="field-accordion__text">
              <h3 class="field-accordion__name"><a class="field-accordion__link" href="/business/education">문화예술 교육</a></h3>
              <p class="field-accordion__desc">어린이·청소년 예술 교실과 시민 예술 아카데미</p>
            </div>
          </li>
          <li class="field-accordion__item">
            <img class="field-accordion__img" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 1400'%3E%3Crect width='1120' height='1400' fill='%236f8f5a'/%3E%3Cpath d='M0 900 Q280 820 560 880 T1120 860 V1400 H0 Z' fill='%233f5733'/%3E%3C/svg%3E" alt="작업실 창가에서 조각을 다듬는 작가" width="1120" height="1400" loading="lazy">
            <div class="field-accordion__text">
              <h3 class="field-accordion__name"><a class="field-accordion__link" href="/business/artist">예술인 지원</a></h3>
              <p class="field-accordion__desc">창작 지원금 공모와 청년 예술가 작업실 임대</p>
            </div>
          </li>
          <li class="field-accordion__item">
            <img class="field-accordion__img" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 1400'%3E%3Crect width='1120' height='1400' fill='%238a5a7a'/%3E%3Cpath d='M0 900 Q280 820 560 880 T1120 860 V1400 H0 Z' fill='%234f3346'/%3E%3C/svg%3E" alt="부두 광장의 저녁 거리 공연" width="1120" height="1400" loading="lazy">
            <div class="field-accordion__text">
              <h3 class="field-accordion__name"><a class="field-accordion__link" href="/business/festival">축제·지역 행사</a></h3>
              <p class="field-accordion__desc">등대 축제와 거리 공연 축제 개최</p>
            </div>
          </li>
          <li class="field-accordion__item">
            <img class="field-accordion__img" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 1400'%3E%3Crect width='1120' height='1400' fill='%235a7a8f'/%3E%3Cpath d='M0 900 Q280 820 560 880 T1120 860 V1400 H0 Z' fill='%232f4352'/%3E%3C/svg%3E" alt="조명을 켠 빈 소극장 객석" width="1120" height="1400" loading="lazy">
            <div class="field-accordion__text">
              <h3 class="field-accordion__name"><a class="field-accordion__link" href="/business/facility">문화시설 운영</a></h3>
              <p class="field-accordion__desc">소극장·전시실 대관과 시설 관리</p>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer id="footer" class="site-footer">
    <div class="container">
      <!-- 로고·연락처 다음에 정책 링크(개인정보 처리방침은 KRDS 필수 — R-32), 마지막에 저작권 -->
      <nav aria-label="약관 및 정책">
        <ul class="site-footer__legal-list">
          <li><a class="site-footer__link site-footer__link--important" href="/privacy">개인정보 처리방침</a></li>
        </ul>
      </nav>
    </div>
  </footer>
</body>
</html>
