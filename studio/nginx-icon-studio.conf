# 아이콘 스튜디오를 문서 사이트와 같은 주소로 붙인다 — https://footer.kr/guide/_icons/
#
# 왜 경로 방식인가: 가이드가 /guide/ 로 서빙되는데 스튜디오만 포트를 따로 쓰면
# 주소 체계가 갈라진다. 팀원이 두 가지를 외워야 할 이유가 없다.
#
# 놓을 자리: /etc/nginx/conf.d/www.icon-studio.conf
#   nginx.conf의 443 default_server 블록이 conf.d/www.*.conf 를 include한다.
#   (conf.d/alias.*.conf 는 DSM 관리 페이지(5000) 블록이라 여기에 쓰면 안 된다)
#
# 설치:
#   sudo cp studio/nginx-icon-studio.conf /etc/nginx/conf.d/www.icon-studio.conf
#   sudo nginx -t && sudo synosystemctl restart nginx
#
# 스튜디오는 127.0.0.1:4710에서만 듣는다. 바깥에서 오는 길은 이 프록시 하나뿐이다.

location /guide/_icons/ {
    proxy_pass http://127.0.0.1:4710/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 아이콘을 만드는 데 몇 분 걸린다. 기본 60초로는 끊긴다.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 15s;

    # 목록·후보가 항상 최신이어야 한다
    proxy_buffering off;
    proxy_cache off;
}

# 슬래시 없이 들어와도 열리게 한다
location = /guide/_icons {
    return 301 /guide/_icons/;
}
