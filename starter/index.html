<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 스타터 틀 표시: 이 줄이 있는 동안 자리값(제목 등)은 경고로만 본다. 프로젝트를 시작하면 지운다 — 그때부터 납품 페이지로 검사한다(R-23) -->
  <meta name="infoux:template" content="starter">
  <title>새 프로젝트</title>
  <link rel="preload" href="assets/fonts/standard-gov/PretendardGOV-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/standard-gov/PretendardGOV-Bold.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>
  <a href="#main" class="skip-to-content">본문 바로가기</a>

  <header id="header" class="site-header">
    <div class="container">
      <!-- 브랜드, GNB, 유틸리티 -->
    </div>
  </header>

  <main id="main">
    <!-- section마다 접근 가능한 이름(제목 + aria-labelledby)과 목적 modifier(section--content 등)를 둔다 -->
    <section class="section section--content" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">새 프로젝트</h1>
        <!-- 페이지 콘텐츠 -->
      </div>
    </section>
  </main>

  <footer id="footer" class="site-footer">
    <div class="container">
      <!-- 로고, 연락처, 저작권, 주요 링크 -->
    </div>
  </footer>

  <script src="src/js/modal.js"></script>
  <script src="src/js/tab.js"></script>
</body>
</html>
